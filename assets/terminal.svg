<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="300"
  viewBox="0 0 1000 300"
  role="img"
  aria-label="Javad Zare Zadegan — Backend, AI and Linux Systems"
>
  <style>
    .background {
      fill: #0d1117;
    }

    .window {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 2;
    }

    .bar {
      fill: #21262d;
    }

    .title {
      fill: #f0f6fc;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 34px;
      font-weight: 700;
    }

    .text {
      fill: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 22px;
    }

    .prompt {
      fill: #3fb950;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
    }

    .highlight {
      fill: #58a6ff;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 22px;
    }

    .line {
      opacity: 0;
      animation: reveal 10s infinite;
    }

    .line-1 {
      animation-delay: 0.5s;
    }

    .line-2 {
      animation-delay: 2s;
    }

    .line-3 {
      animation-delay: 3.5s;
    }

    .line-4 {
      animation-delay: 5s;
    }

    .cursor {
      fill: #3fb950;
      animation: blink 0.8s steps(2, start) infinite;
    }

    .status {
      fill: #3fb950;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes reveal {
      0%, 5% {
        opacity: 0;
        transform: translateY(5px);
      }

      10%, 82% {
        opacity: 1;
        transform: translateY(0);
      }

      92%, 100% {
        opacity: 0;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }
  </style>

  <rect class="background" width="1000" height="300" rx="18" />

  <rect
    class="window"
    x="18"
    y="18"
    width="964"
    height="264"
    rx="14"
  />

  <path
    class="bar"
    d="M32 18 H968 A14 14 0 0 1 982 32 V62 H18 V32 A14 14 0 0 1 32 18"
  />

  <circle cx="45" cy="40" r="7" fill="#ff5f56" />
  <circle cx="69" cy="40" r="7" fill="#ffbd2e" />
  <circle cx="93" cy="40" r="7" fill="#27c93f" />

  <text
    x="500"
    y="48"
    text-anchor="middle"
    fill="#8b949e"
    font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
    font-size="15"
  >
    javad@github: ~/profile
  </text>

  <g class="line line-1">
    <text class="prompt" x="55" y="105">$</text>
    <text class="text" x="82" y="105">whoami</text>
  </g>

  <g class="line line-2">
    <circle class="status" cx="67" cy="142" r="6" />
    <text class="title" x="88" y="153">Javad Zare Zadegan</text>
  </g>

  <g class="line line-3">
    <text class="prompt" x="55" y="200">$</text>
    <text class="text" x="82" y="200">focus --show</text>
  </g>

  <g class="line line-4">
    <text class="highlight" x="55" y="242">
      Backend Engineering  •  AI Infrastructure  •  Linux Systems
    </text>
    <rect class="cursor" x="820" y="220" width="12" height="27" rx="2" />
  </g>
</svg>
